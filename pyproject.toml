[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebase"
version = "0.1.0"
description = "A lightweight runtime for installing and routing independent AI capability Bricks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
whitebase = "whitebase.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whitebase*"]

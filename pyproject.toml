[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebase"
version = "0.1.0"
description = "A lightweight runtime for installing and routing independent AI capability Bricks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Rajbin-1" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rajbin-1/WhiteBase"
Repository = "https://github.com/Rajbin-1/WhiteBase.git"
Issues = "https://github.com/Rajbin-1/WhiteBase/issues"

[project.scripts]
whitebase = "whitebase.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whitebase*"]

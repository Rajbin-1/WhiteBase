name: CI

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime
        run: python -m pip install -e .
      - name: Runtime and package contract tests
        run: python -m unittest discover -s tests -p test_whitebase.py -v
      - name: Runtime architecture regression tests
        run: python -m unittest discover -s tests -p test_architecture_contracts.py -v
      - name: Runtime stress tests
        run: python -m unittest discover -s tests/stress -p test_whitebase_stress.py -v
      - name: Runtime performance tests
        run: |
          python -m unittest discover -s tests/performance -p test_whitebase_performance.py -v
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
